name: Deploy Bible Reader Online

on:
  # Trigger on push to main branch
  push:
    branches: [ main ]
  
  # Allow manual deployment from GitHub UI
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build and Deploy to Server
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.DEPLOY_GHCR_TOKEN }}
        
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: .
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/biblereader:latest
          ghcr.io/${{ github.repository_owner }}/biblereader:${{ github.sha }}
          
    - name: Deploy to server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SERVER_SSH_KEY }}
        port: ${{ secrets.SERVER_PORT || 22 }}
        script: |
          # Set variables
          DEPLOY_DIR="/home/deploy/apps/biblereader"
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/biblereader"
          
          echo "🚀 Deploying Bible Reader..."
          
          # Create deployment directory if it doesn't exist
          mkdir -p $DEPLOY_DIR
          cd $DEPLOY_DIR
          
          # Pull the new image
          echo "📥 Pulling Docker image..."
          docker pull $IMAGE_NAME:${{ github.sha }}
          docker tag $IMAGE_NAME:${{ github.sha }} $IMAGE_NAME:latest
          
          # Stop existing container
          echo "🛑 Stopping existing containers..."
          docker stop biblereader || true
          docker rm biblereader || true
          
          # Create .env if it doesn't exist
          if [ ! -f ".env" ]; then
            echo "⚠️  .env file doesn't exist, creating template..."
            cat > .env << 'EOF'
          NODE_ENV=production
          PORT=3000
          DOMAIN=biblereader.online
          LOG_LEVEL=info
          EOF
            echo "📝 Created .env file with defaults"
          fi
          
          # Create directories for volumes
          mkdir -p logs data dbs
          
          # Ensure database file exists in the host directory
          if [ ! -f "dbs/bible-sqlite.db" ]; then
            echo "📚 Copying database file from container..."
            # Run a temporary container to extract the database
            docker run --rm -v $(pwd)/dbs:/tmp/dbs $IMAGE_NAME:latest sh -c "cp /app/dbs/bible-sqlite.db /tmp/dbs/"
          fi
          
          # Start new container
          echo "� Starting new container..."
          docker run -d \
            --name biblereader \
            --restart unless-stopped \
            -p 3001:3000 \
            --env-file .env \
            -v $(pwd)/logs:/app/logs \
            -v $(pwd)/data:/app/data \
            -v $(pwd)/dbs:/app/dbs \
            $IMAGE_NAME:latest
          
          # Wait a moment for container to start
          sleep 5
          
          # Show status
          echo "� Deployment Status:"
          docker ps --filter name=biblereader
          
          # Test health
          echo "🏥 Health Check:"
          curl -f http://localhost:3001/api/books || echo "❌ Health check failed"
          
          # Cleanup old images (keep last 3)
          echo "🧹 Cleaning up old images..."
          docker images $IMAGE_NAME --format "table {{.Tag}}\t{{.ID}}" | grep -E '^[a-f0-9]{12}' | tail -n +4 | awk '{print $2}' | xargs -r docker rmi || true
          
          echo "✅ Deployment complete!"
          echo "🌐 Site should be available at: https://biblereader.online"
