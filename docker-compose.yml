services:
  biblereader:
    image: ghcr.io/jimbarrett/biblereader:${DOCKER_IMAGE_TAG:-latest}
    container_name: biblereader
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
    env_file:
      - .env
    volumes:
      # Mount logs directory for persistence
      - ./logs:/app/logs
      # Mount data directory for database files
      - ./data:/app/data
      # Keep the existing SQLite database mount
      - ./dbs:/app/dbs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/books"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - biblereader-network

networks:
  biblereader-network:
    driver: bridge
